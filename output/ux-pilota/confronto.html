<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tao Veda · Confronto del pilota UX</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#181916;color:#eee9dd;font:16px/1.5 system-ui,sans-serif}header{padding:24px 28px;border-bottom:1px solid #55513e}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 16px;color:#c9c5ba}.controls{display:flex;flex-wrap:wrap;gap:20px}label{display:flex;align-items:center;gap:10px}select{font:inherit;padding:10px;background:#23251f;color:#eee9dd;border:1px solid #9b8958;border-radius:4px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:24px}h2{font-size:17px;margin:0}article>header{padding:0 0 14px;display:flex;justify-content:space-between;gap:16px;align-items:center;border:0}a{color:#ddc47e;text-underline-offset:3px}.frame{width:100%;overflow:hidden;background:#0a0a0a;border:1px solid #55513e}iframe{border:0;display:block;transform-origin:top left}a:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:4px}@media(max-width:760px){main{grid-template-columns:1fr;padding:16px}header{padding:20px}}
  </style>
</head>
<body>
  <header>
    <h1>Tao Veda · Geometrie in relazione</h1>
    <p>Confronto locale con i contenuti invariati. Le anteprime si possono scorrere separatamente. Gli invii della Mappa sono simulati.</p>
    <div class="controls">
      <label>Pagina <select id="page"><option value="/">Homepage</option><option value="/conoscenza/la-via-della-conoscenza">Guida culturale</option><option value="/mappa-tao-veda">Mappa</option></select></label>
      <label>Formato <select id="size"><option value="1280">Desktop · 1280 px</option><option value="390">Mobile · 390 px</option><option value="320">Mobile piccolo · 320 px</option></select></label>
    </div>
  </header>
  <main>
    <article><header><h2>Prima</h2><a id="before-link" target="_blank" rel="noopener" href="http://127.0.0.1:4332/">Apri a piena larghezza</a></header><div class="frame"><iframe id="before" title="Versione precedente" src="http://127.0.0.1:4332/"></iframe></div></article>
    <article><header><h2>Pilota</h2><a id="after-link" target="_blank" rel="noopener" href="http://127.0.0.1:4323/">Apri a piena larghezza</a></header><div class="frame"><iframe id="after" title="Nuovo pilota" src="http://127.0.0.1:4323/"></iframe></div></article>
  </main>
  <script>
    const page=document.getElementById('page');
    const size=document.getElementById('size');
    function resize(){for(const frame of document.querySelectorAll('iframe')){const width=Number(size.value);const height=width<500?844:1000;const scale=Math.min(1,frame.parentElement.clientWidth/width);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`scale(${scale})`;frame.parentElement.style.height=(height*scale)+'px';}}
    page.addEventListener('change',()=>{for(const [id,port] of [['before',4332],['after',4323]]){const url=`http://127.0.0.1:${port}${page.value}`;document.getElementById(id).src=url;document.getElementById(id+'-link').href=url;}});
    size.addEventListener('change',resize);
    const observer=new ResizeObserver(resize);document.querySelectorAll('.frame').forEach(el=>observer.observe(el));resize();
  </script>
</body>
</html>
