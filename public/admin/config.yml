# ====================================================================
# Tao Veda — Sveltia CMS config
# ====================================================================
# Definisce la UI redazionale di /admin. Deve restare allineato allo schema
# Zod in src/content/config.ts. Se modifichi quello schema, aggiorna qui e
# lancia `npm run check`.
#
# Auth: GitHub OAuth via Netlify Functions (netlify/functions/auth.js e
# auth-callback.js), mappate su /api/auth e /api/auth/callback in public/_redirects.
# ====================================================================

backend:
  name: github
  repo: AndroiDario/tao-veda.org
  branch: main
  base_url: https://www.tao-veda.org
  auth_endpoint: api/auth
  commit_messages:
    create: 'CMS: crea {{collection}} "{{slug}}"'
    update: 'CMS: aggiorna {{collection}} "{{slug}}"'
    delete: 'CMS: elimina {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload media "{{path}}"'
    deleteMedia: 'CMS: elimina media "{{path}}"'

# Sviluppo locale: `npx @sveltia/cms-proxy-server` + `npm run dev`, poi /admin
# scrive direttamente sul filesystem invece che su GitHub.
local_backend: true

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads
locale: it
show_preview_links: false

collections:
  # ----------------------------------------------------------------
  # Formazione — applicazione sul sottodominio
  # ----------------------------------------------------------------
  - name: corsi_formazione
    label: Formazione · Corsi
    label_singular: Corso
    folder: formazione/src/content/corsi
    create: true
    slug: '{{slug}}'
    identifier_field: titolo
    fields:
      - { name: id, label: Identificativo stabile, widget: string }
      - { name: titolo, label: Titolo, widget: string }
      - { name: sommario, label: Sommario, widget: text }
      - { name: destinatari, label: Destinatari, widget: text }
      - { name: risultati, label: Risultati attesi, widget: list }
      - { name: stato, label: Stato, widget: select, options: [bozza, pubblicato, archiviato], default: bozza }
      - { name: versione, label: Versione, widget: string, default: '1.0' }
      - { name: durata, label: Durata indicativa, widget: string }
      - { name: durataIso, label: 'Durata ISO 8601', widget: string, hint: 'Esempio: PT6H.' }
      - { name: seoTitle, label: 'SEO title', widget: string, required: false }
      - { name: seoDescription, label: 'SEO description', widget: text, required: false }
      - { name: ogImage, label: 'URL assoluto immagine social', widget: string }
      - { name: aggiornato, label: 'Aggiornato il', widget: datetime, format: 'YYYY-MM-DD', date_format: true, time_format: false, picker_utc: true, required: false }
      - { name: ordine, label: Ordine, widget: number, value_type: int, default: 100 }
      - { name: body, label: Introduzione, widget: markdown, required: false }

  - name: moduli_formazione
    label: Formazione · Moduli
    label_singular: Modulo
    folder: formazione/src/content/moduli
    create: true
    slug: '{{slug}}'
    identifier_field: titolo
    sortable_fields: [ordine, titolo]
    fields:
      - { name: corso, label: ID corso, widget: string, default: via-tao-veda }
      - { name: slug, label: Slug stabile, widget: string }
      - { name: titolo, label: Titolo, widget: string }
      - { name: sommario, label: Sommario, widget: text }
      - { name: risultati, label: Risultati del modulo, widget: list }
      - { name: durataMinuti, label: Durata in minuti, widget: number, value_type: int }
      - { name: ordine, label: Ordine, widget: number, value_type: int }
      - { name: pubblico, label: 'Panoramica pubblica', widget: boolean, default: true }
      - { name: indicizzabile, label: 'Indicizzabile', widget: boolean, default: true }
      - { name: seoTitle, label: 'SEO title', widget: string, required: false }
      - { name: seoDescription, label: 'SEO description', widget: text, required: false }
      - { name: aggiornato, label: 'Aggiornato il', widget: datetime, format: 'YYYY-MM-DD', date_format: true, time_format: false, picker_utc: true, required: false }
      - { name: immagine, label: URL immagine, widget: string, required: false }
      - { name: immagineAlt, label: 'Testo alternativo immagine', widget: string, required: false, hint: 'Obbligatorio se inserisci una immagine.' }
      - { name: immagineWidth, label: 'Larghezza immagine', widget: number, value_type: int, required: false }
      - { name: immagineHeight, label: 'Altezza immagine', widget: number, value_type: int, required: false }
      - { name: didascalia, label: Didascalia, widget: string, required: false }
      - { name: draft, label: Bozza, widget: boolean, default: true }
      - { name: body, label: Introduzione, widget: markdown }

  - name: lezioni_formazione
    label: Formazione · Lezioni
    label_singular: Lezione
    folder: formazione/src/content/lezioni
    create: true
    slug: '{{slug}}'
    identifier_field: titolo
    sortable_fields: [modulo, ordine, titolo]
    fields:
      - { name: corso, label: ID corso, widget: string, default: via-tao-veda }
      - { name: modulo, label: Slug modulo, widget: string }
      - { name: slug, label: Slug stabile, widget: string }
      - { name: titolo, label: Titolo, widget: string }
      - { name: sommario, label: Sommario, widget: text }
      - { name: tipo, label: Tipo, widget: select, options: [studio, pratica, integrazione] }
      - { name: durataMinuti, label: Durata in minuti, widget: number, value_type: int }
      - { name: ordine, label: Ordine nel modulo, widget: number, value_type: int }
      - { name: obiettivi, label: Obiettivi, widget: list, required: false }
      - { name: audio, label: URL audio registrato, widget: string, required: false }
      - { name: indicazioni, label: Indicazioni per la pratica, widget: text, required: false }
      - { name: trascrizione, label: Trascrizione audio, widget: text, required: false }
      - { name: domande, label: Domande, widget: list, required: false }
      - name: fonti
        label: Fonti e collegamenti
        widget: list
        required: false
        fields:
          - { name: titolo, label: Titolo, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: draft, label: Bozza, widget: boolean, default: true }
      - { name: body, label: Corpo della lezione, widget: markdown }

  # ----------------------------------------------------------------
  # Diario (blog)
  # ----------------------------------------------------------------
  - name: diario
    label: Diario (blog)
    label_singular: Articolo
    description: Articoli sempreverdi dell'hub /conoscenza.
    folder: src/content/diario
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{data}}'
    sortable_fields: [data, title, tradizione]
    fields:
      - { name: title, label: Titolo, widget: string }
      - { name: description, label: Sommario, widget: text, hint: 'Frase di sintesi: appare nelle liste e nei meta description.' }
      - { name: data, label: Data, widget: datetime, format: 'YYYY-MM-DD', date_format: true, time_format: false, picker_utc: true }
      - { name: aggiornato, label: 'Aggiornato il', widget: datetime, format: 'YYYY-MM-DD', date_format: true, time_format: false, picker_utc: true, required: false }
      - name: tradizione
        label: Tradizione
        widget: select
        options: [tao, veda, kundalini, occidente, tarocchi, pratica]
      - name: pillar
        label: 'Pillar di riferimento (cluster SEO)'
        widget: select
        options: [tao, veda, kundalini, occidente, tarocchi, pratica]
        required: false
      - { name: tags, label: Tag, widget: list, default: [], required: false }
      - name: autore
        label: Autore
        widget: select
        options:
          - { label: 'Dario Pagnoni', value: 'dario-pagnoni' }
        default: 'dario-pagnoni'
      - { name: cover, label: 'Immagine di copertina', widget: image, required: false }
      - { name: ogImage, label: 'Immagine social specifica', widget: image }
      - name: fonti
        label: 'Fonti e riferimenti'
        widget: list
        hint: 'Inserire almeno una fonte primaria, istituzionale o bibliografica.'
        fields:
          - { name: titolo, label: Titolo, widget: string }
          - { name: url, label: URL, widget: string }
          - name: tipo
            label: Tipo
            widget: select
            options: [primaria, istituzionale, bibliografica]
      - { name: draft, label: Bozza, widget: boolean, default: true }
      - { name: body, label: Corpo, widget: markdown }

  # ----------------------------------------------------------------
  # Tradizioni (pillar)
  # ----------------------------------------------------------------
  - name: tradizioni
    label: Tradizioni (pillar)
    label_singular: Pillar
    description: Pagine di orientamento sulle grandi correnti. Lo slug del file deve coincidere con la tradizione.
    folder: src/content/tradizioni
    create: true
    slug: '{{slug}}'
    identifier_field: titolo
    summary: '{{titolo}}'
    sortable_fields: [ordine, titolo]
    fields:
      - { name: titolo, label: Titolo, widget: string }
      - name: tradizione
        label: Tradizione (chiave)
        widget: select
        options: [tao, veda, kundalini, occidente, tarocchi, pratica]
      - { name: eyebrow, label: 'Etichetta sopra il titolo', widget: string, required: false, default: 'Tradizione' }
      - { name: sommario, label: 'Sommario (apertura, GEO)', widget: text }
      - { name: aggiornato, label: 'Aggiornato il', widget: datetime, format: 'YYYY-MM-DD', date_format: true, time_format: false, picker_utc: true, required: false }
      - { name: ordine, label: Ordine, widget: number, value_type: int, default: 100 }
      - { name: draft, label: Bozza, widget: boolean, default: false }
      - { name: body, label: Corpo, widget: markdown }

  # ----------------------------------------------------------------
  # Glossario
  # ----------------------------------------------------------------
  - name: glossario
    label: Glossario
    label_singular: Voce
    description: Una parola, una voce. Definizioni brevi e atomiche (utili per la GEO).
    folder: src/content/glossario
    create: true
    slug: '{{slug}}'
    identifier_field: termine
    summary: '{{termine}}'
    sortable_fields: [termine, tradizione]
    fields:
      - { name: termine, label: Termine, widget: string }
      - name: tradizione
        label: Tradizione
        widget: select
        options: [tao, veda, kundalini, occidente, tarocchi, pratica]
      - { name: definizione, label: Definizione, widget: text, hint: '1-2 frasi chiare.' }
      - { name: origine, label: 'Origine e contesto', widget: text, required: false }
      - { name: usoTaoVeda, label: 'Uso in Tao Veda', widget: text, required: false }
      - { name: limite, label: 'Limite della definizione', widget: text, required: false }
      - { name: sinonimi, label: Sinonimi, widget: list, required: false }
      - { name: vediAnche, label: 'Vedi anche (slug di altri termini)', widget: list, required: false, hint: 'Es. qi, chakra, dosha.' }
      - name: fonte
        label: 'Fonte esterna (opzionale)'
        widget: object
        required: false
        hint: 'Fonte autorevole, es. Treccani. Niente affiliazioni.'
        fields:
          - { name: titolo, label: Titolo, widget: string, required: false }
          - { name: url, label: URL, widget: string, required: false }
      - { name: ordine, label: Ordine, widget: number, value_type: int, default: 100 }
      - { name: draft, label: Bozza, widget: boolean, default: false }
      - { name: body, label: 'Approfondimento (opzionale)', widget: markdown, required: false }

  # ----------------------------------------------------------------
  # Bibliografia ragionata
  # ----------------------------------------------------------------
  - name: bibliografia
    label: Bibliografia
    label_singular: Opera
    description: Bibliografia ragionata. Ogni voce ha una nota su perché è rilevante per Tao Veda.
    folder: src/content/bibliografia
    create: true
    slug: '{{slug}}'
    identifier_field: titolo
    summary: '{{titolo}} — {{autore}}'
    sortable_fields: [ordine, titolo, autore]
    fields:
      - { name: titolo, label: Titolo, widget: string }
      - { name: autore, label: Autore, widget: string }
      - { name: anno, label: Anno, widget: string, required: false, hint: 'Anche approssimativo: "VI sec. a.C.".' }
      - { name: titoloOriginale, label: 'Titolo originale', widget: string, required: false }
      - name: tradizione
        label: Tradizione
        widget: select
        options: [tao, veda, kundalini, occidente, tarocchi, pratica]
      - name: livello
        label: Livello
        widget: select
        options: [fondamentale, approfondimento, contemporaneo]
      - { name: descrizione, label: 'Nota ragionata', widget: text }
      - { name: link, label: 'Link (opzionale)', widget: string, required: false }
      - { name: ordine, label: Ordine, widget: number, value_type: int, default: 100 }
      - { name: draft, label: Bozza, widget: boolean, default: false }
      - { name: body, label: 'Note estese (opzionale)', widget: markdown, required: false }
