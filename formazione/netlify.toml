[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # La chiave Supabase publishable viene incorporata intenzionalmente nel client.
  # RLS protegge i dati; le chiavi sb_secret_ non devono invece essere pubbliche.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SUPABASE_ANON_KEY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
